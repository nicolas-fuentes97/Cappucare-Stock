org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# --- Firma del APK release (OPCIONAL) ---------------------------------------------------------
# NO escribas aquí claves reales ni subas un keystore al repositorio. Define estas 4 propiedades
# en ~/.gradle/gradle.properties (archivo personal, fuera del proyecto) o como variables de
# entorno con los mismos nombres. Si no existen, el build release se genera igual, sin firmar.
#
# CAPPUCARE_STORE_FILE=/ruta/al/almacen.jks
# CAPPUCARE_STORE_PASSWORD=...
# CAPPUCARE_KEY_ALIAS=...
# CAPPUCARE_KEY_PASSWORD=...

# --- Experiencia 3: servidor (API) -------------------------------------------------------------
# Dirección inicial del servidor. 10.0.2.2 es el PC desde el emulador de Android Studio. Con un
# teléfono físico usa la IP del PC (http://192.168.x.x:3000/) o la URL https de Port Forwarding.
# Se puede cambiar SIN recompilar desde la app: Login > Servidor.
API_BASE_URL=http://10.0.2.2:3000/

# Modo INICIAL de la app: false = modo local (solo Room, sin servidor); true = modo servidor: usa lo
# que implementes en los TODO(E3-n). Solo define el valor inicial: después el usuario lo cambia en
# la app (Login > Servidor > "Modo local") y esa elección queda guardada. Cambia a true cuando
# termines la capa remota y el repositorio.
USAR_API=false
